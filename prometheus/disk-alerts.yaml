groups:
  - name: host-disk-alerts
    rules:
      - alert: DiskUsageWarning
        expr: |
          100 * (
            1 - node_filesystem_avail_bytes{fstype!~"tmpfs|overlay"}
                / node_filesystem_size_bytes{fstype!~"tmpfs|overlay"}
          ) > 80
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "Disk usage above 80% on {{ $labels.instance }}"
          description: "Filesystem {{ $labels.mountpoint }} is above 80% used."

      - alert: DiskUsageCritical
        expr: |
          100 * (
            1 - node_filesystem_avail_bytes{fstype!~"tmpfs|overlay"}
                / node_filesystem_size_bytes{fstype!~"tmpfs|overlay"}
          ) > 90
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "Disk usage above 90% on {{ $labels.instance }}"
          description: "Filesystem {{ $labels.mountpoint }} is above 90% used."
